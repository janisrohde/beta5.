<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="app-version" content="2.0.4">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F1F6EC">
    <title>Einkaufsliste</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css?v=2.0.4">
</head>
<body>
    <div class="app-container list-view" style="padding-top:calc(env(safe-area-inset-top,0px) + 16px)">
        <header class="list-topbar">
            <button class="icon-btn back-btn" id="backBtn" aria-label="Zurück zur Übersicht">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="list-topbar-title">
                <h1 id="listTitle">Einkaufsliste</h1>
                <span id="progressLabel"></span>
            </div>
            <button class="icon-btn menu-btn" id="menuBtn" aria-label="Listenmenü öffnen">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                    <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
                </svg>
            </button>
        </header>
        <p class="sync-hint" id="syncHint">Gespeicherter Stand – wird synchronisiert …</p>
        <span class="progress" aria-hidden="true"><span class="progress-fill" id="progressBar" style="width:0%"></span></span>

        <main class="list-content">
            <section class="add-product-section" aria-label="Produkt hinzufügen">
                <!-- Eingabe + Hinzufügen -->
                <div class="add-product-input-wrapper">
                    <input type="text" id="productInput" placeholder="Was brauchst du?" autocomplete="off">
                    <button class="add-btn" id="addProductBtn" title="Hinzufügen (oder Enter drücken)" aria-label="Produkt hinzufügen">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                </div>
                <!-- Tool-Chips: Foto / Barcode / Sprache -->
                <div class="tool-row">
                    <button class="tool-chip add-action-btn" id="cameraBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                        Foto
                    </button>
                    <button class="tool-chip add-action-btn" id="barcodeScanBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                            <path d="M3 5v14M7 5v14M11 5v14M15 5v8M19 5v8M15 17v2M19 17v2"/>
                        </svg>
                        Barcode
                    </button>
                </div>
                <!-- Kategorien mit Bearbeiten-Button -->
                <div class="category-selector-row" style="margin-top:10px;">
                    <div class="category-selector" id="categorySelector"></div>
                    <button class="category-edit-btn" id="categoryEditBtn" title="Kategorien bearbeiten" aria-label="Kategorien bearbeiten">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9"/>
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                    </button>
                </div>
            </section>

            <div class="products-container" id="productsContainer"></div>

            <div class="empty-state" id="emptyState">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <p>Diese Liste ist noch leer</p>
                <span>Füge Produkte hinzu, um loszulegen</span>
            </div>
        </main>

    </div>

    <!-- Kamera Auswahl -->
    <div class="modal-overlay" id="cameraModal">
        <div class="modal action-sheet" role="dialog" aria-modal="true" aria-label="Foto hinzufügen">
            <button class="action-sheet-item" id="galleryAction">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                Aus Galerie auswählen
            </button>
            <button class="action-sheet-item" id="photoAction">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
                Foto aufnehmen
            </button>
            <button class="action-sheet-cancel" id="cancelCamera">Abbrechen</button>
        </div>
    </div>

    <!-- Barcode Scanner (Fullscreen) -->
    <div class="scanner-overlay" id="barcodeModal">
        <video id="scannerVideo" autoplay muted playsinline></video>
        <div id="barcode-reader"></div>
        <div class="scanner-ui">
            <div class="scanner-topbar">
                <button class="scanner-close-btn" id="cancelBarcode" aria-label="Scanner schließen">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <span class="scanner-topbar-title">Barcode scannen</span>
                <div class="scanner-topbar-spacer"></div>
            </div>
            <div class="scanner-center">
                <div class="scanner-frame">
                    <span class="sc-corner sc-tl"></span>
                    <span class="sc-corner sc-tr"></span>
                    <span class="sc-corner sc-bl"></span>
                    <span class="sc-corner sc-br"></span>
                    <div class="scanner-line"></div>
                </div>
                <p id="barcodeStatus" class="scanner-hint">Halte den Barcode in den Rahmen</p>
            </div>
        </div>
    </div>

    <!-- Foto Vorschau -->
    <div class="modal-overlay" id="imagePreviewModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="imagePreviewTitle">
            <div class="modal-header"><h2 id="imagePreviewTitle">Produkt mit Foto</h2></div>
            <div class="modal-body">
                <img id="previewImg" src="" alt="Vorschau" style="width:100%;border-radius:12px;margin-bottom:16px;max-height:200px;object-fit:cover;">
                <div class="input-group">
                    <label for="imageProductName">Name des Produkts</label>
                    <input type="text" id="imageProductName" placeholder="z.B. Eier" autocomplete="off">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelImagePreview">Abbrechen</button>
                <button class="btn btn-confirm" id="confirmImageProduct">Zur Liste hinzufügen</button>
            </div>
        </div>
    </div>

    <!-- Foto Vollbild -->
    <div class="modal-overlay" id="photoViewModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="photoViewTitle">
            <div class="modal-header"><h2 id="photoViewTitle">Foto</h2></div>
            <div class="modal-body" style="padding:0 16px 16px;">
                <img id="photoViewImg" src="" alt="Produktfoto" style="width:100%;border-radius:12px;max-height:400px;object-fit:contain;">
            </div>
            <div class="modal-footer">
                <button class="btn btn-confirm" id="closePhotoView">Schließen</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">

    <!-- Menü -->
    <div class="modal-overlay" id="menuModal">
        <div class="modal action-sheet" role="dialog" aria-modal="true" aria-label="Listenmenü">
            <button class="action-sheet-item" id="editCategoriesAction">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
                Kategorien bearbeiten
            </button>
            <button class="action-sheet-item" id="renameListAction">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                Liste umbenennen
            </button>
            <button class="action-sheet-item" id="recentlyDeletedAction">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 .49-4.92"></path>
                </svg>
                Zuletzt gelöscht (7 Tage)
            </button>
            <button class="action-sheet-item" id="backupAction">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Sicherung herunterladen
            </button>
            <button class="action-sheet-item" id="clearListAction">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                </svg>
                Alle Produkte löschen
            </button>
            <button class="action-sheet-item danger" id="deleteListAction">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
                Liste löschen
            </button>
            <button class="action-sheet-item danger" id="logoutAction">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Abmelden
            </button>
            <button class="action-sheet-cancel" id="cancelMenu">Abbrechen</button>
        </div>
    </div>

    <!-- Zuletzt gelöscht -->
    <div class="modal-overlay" id="recentlyDeletedModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="recentlyDeletedTitle">
            <div class="modal-header"><h2 id="recentlyDeletedTitle">Zuletzt gelöscht</h2></div>
            <div class="modal-body" id="recentlyDeletedBody"></div>
            <div class="modal-footer">
                <button class="btn btn-confirm" id="closeRecentlyDeleted">Schließen</button>
            </div>
        </div>
    </div>

    <!-- Kategorien bearbeiten -->
    <div class="modal-overlay" id="editCategoriesModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editCategoriesTitle">
            <div class="modal-header"><h2 id="editCategoriesTitle">Kategorien bearbeiten</h2></div>
            <div class="modal-body">
                <div id="categoriesList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:300px;overflow-y:auto;"></div>
                <div class="input-group">
                    <label for="newCategoryName">Neue Kategorie hinzufügen</label>
                    <div style="display:flex;gap:8px;">
                        <input type="text" id="newCategoryName" placeholder="z.B. Getränke" autocomplete="off" style="flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:16px;outline:none;">
                        <button class="btn btn-confirm" id="addCategoryBtn" style="padding:12px 16px;flex-shrink:0;">+</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-confirm" id="closeEditCategories">Fertig</button>
            </div>
        </div>
    </div>

    <!-- Umbenennen -->
    <div class="modal-overlay" id="renameModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="renameTitle">
            <div class="modal-header"><h2 id="renameTitle">Liste umbenennen</h2></div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="renameInput">Neuer Name</label>
                    <input type="text" id="renameInput" placeholder="Name eingeben" autocomplete="off">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelRename">Abbrechen</button>
                <button class="btn btn-confirm" id="confirmRename">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Bestätigung -->
    <script type="module" src="script.js?v=2.0.4"></script>
</body>
</html>
